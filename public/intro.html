<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<style>
:root{--bg:#000;--btn:#ffcf33;--btn-fg:#101a2e}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:fixed;left:0;right:0;bottom:0;height:35%;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
.dock{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}.buy{display:inline-block;padding:11px 34px;text-align:center;text-decoration:none;font:700 1rem "Kantumruy Pro","Noto Sans Khmer",system-ui,sans-serif;background:var(--btn);color:var(--btn-fg);border-radius:999px}
.buy:hover{filter:brightness(1.07)}
.buy:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<video src="/header_400.mp4" autoplay muted loop playsinline></video>
<div class="shade"></div>
<div class="dock"><a class="buy" href="#">Buy now</a></div>
</body>
</html>
